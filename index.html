<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貴朱老師貴州旅行</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        #gameCanvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            background-color: ivory;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1200" height="780"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 變數設定
let card = new Array(26).fill(0);
let face = new Array(26).fill(0);
let memo = new Array(26).fill(0);

let stage = 1;
let use_photo_bg = false;
let bg_button_clicked = false;

let proc = 0;
let tmr = 0;
let sel1 = 0;
let sel2 = 0;
let player = 0;
let computer = 0;

const CARD_W = 130;
const CARD_H = 195;
const CELL_W = 138;
const CELL_H = 195;

// 圖片載入容器
const img = new Array(14);
let img_back_l2 = new Image();
let bg_img1 = new Image();
let bg_img2 = new Image();

// 輔助載入圖片 (支援 jpg / png)
function loadImage(baseName, callback) {
    let image = new Image();
    image.src = baseName + ".jpg";
    image.onload = () => callback(image);
    image.onerror = () => {
        image.src = baseName + ".png";
        image.onload = () => callback(image);
    };
}

// 載入所有圖片
for (let i = 0; i < 14; i++) {
    loadImage(i.toString(), (loadedImg) => img[i] = loadedImg);
}
loadImage("0_level2", (loadedImg) => img_back_l2 = loadedImg);
loadImage("bg", (loadedImg) => bg_img1 = loadedImg);
loadImage("bg2", (loadedImg) => bg_img2 = loadedImg);

function shuffle_card() {
    for (let i = 0; i < 26; i++) {
        card[i] = 1 + (i % 13);
        face[i] = 0;
        memo[i] = 0;
    }
    for (let i = 0; i < 100; i++) {
        let r1 = Math.floor(Math.random() * 13);
        let r2 = Math.floor(Math.random() * 13) + 13;
        let temp = card[r1];
        card[r1] = card[r2];
        card[r2] = temp;
    }
}

function com_select1() {
    for (let i = 0; i < 25; i++) {
        for (let j = i + 1; j < 26; j++) {
            if (memo[i] > 0 && memo[i] === memo[j] && face[i] === 0 && face[j] === 0) {
                return i;
            }
        }
    }
    let unopened = [];
    for (let i = 0; i < 26; i++) if (face[i] === 0) unopened.push(i);
    return unopened.length > 0 ? unopened[Math.floor(Math.random() * unopened.length)] : 0;
}

function com_select2(first_card_idx) {
    let target_num = card[first_card_idx];
    for (let i = 0; i < 26; i++) {
        if (i !== first_card_idx && memo[i] === target_num && face[i] === 0) {
            return i;
        }
    }
    let unopened = [];
    for (let i = 0; i < 26; i++) if (face[i] === 0 && i !== first_card_idx) unopened.push(i);
    return unopened.length > 0 ? unopened[Math.floor(Math.random() * unopened.length)] : first_card_idx;
}

function draw_card() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (use_photo_bg) {
        let current_bg = (stage === 1) ? bg_img1 : bg_img2;
        if (current_bg && current_bg.complete && current_bg.naturalWidth !== 0) {
            ctx.drawImage(current_bg, 0, 0, 1200, 780);
        }
    }

    if (proc !== 0) {
        for (let i = 0; i < 26; i++) {
            if (face[i] === 2) continue;

            let x = Math.floor(i % 7) * CELL_W + Math.floor(CELL_W / 2);
            let y = Math.floor(i / 7) * CELL_H + Math.floor(CELL_H / 2);

            if (face[i] === 0) {
                let backImg = (stage === 2 && img_back_l2 && img_back_l2.complete) ? img_back_l2 : img[0];
                if (backImg && backImg.complete) {
                    ctx.drawImage(backImg, x - CARD_W / 2, y - CARD_H / 2, CARD_W, CARD_H);
                }
            } else if (face[i] === 1) {
                let cardImg = img[card[i]];
                if (cardImg && cardImg.complete) {
                    ctx.drawImage(cardImg, x - CARD_W / 2, y - CARD_H / 2, CARD_W, CARD_H);
                }
            }
        }
    }
}

canvas.addEventListener("click", (e) => {
    let rect = canvas.getBoundingClientRect();
    let ex = e.clientX - rect.left;
    let ey = e.clientY - rect.top;

    if (proc === 0) {
        if (ex >= 300 && ex <= 900 && ey >= 270 && ey <= 370) {
            use_photo_bg = !use_photo_bg;
            bg_button_clicked = true;
            return;
        }

        if (bg_button_clicked) {
            if (ex >= 250 && ex <= 550 && ey >= 420 && ey <= 520) {
                stage = 1;
                shuffle_card();
                player = 0; computer = 0; proc = 1; tmr = 0;
                return;
            }
            if (ex >= 650 && ex <= 950 && ey >= 420 && ey <= 520) {
                stage = 2;
                shuffle_card();
                player = 0; computer = 0; proc = 1; tmr = 0;
                return;
            }
        }
    }

    if (proc === 1 || proc === 2) {
        let x = Math.floor(ex / CELL_W);
        let y = Math.floor(ey / CELL_H);
        if (x >= 0 && x <= 6 && y >= 0 && y <= 3) {
            let n = x + y * 7;
            if (n < 26 && face[n] === 0) {
                if (proc === 1) {
                    face[n] = 1; sel1 = n; proc = 2;
                } else if (proc === 2) {
                    face[n] = 1; sel2 = n; proc = 3; tmr = 0;
                }
                return;
            }
        }
    }

    if (proc === 7) {
        let msg = "";
        if (player > computer) {
            msg = (stage === 1) ? 
                "✨ 太棒了！先下一城！😎\n不過第一關只是熱身，電腦在第二關會火力全開的！🔥\n敢不敢繼續挑戰 Level 2，證明貴州旅行的回憶很牢固？😈" : 
                "🎉恭喜你，打敗了電腦！\n看來貴州旅行的回憶還很牢固！🤩是不是經常偷偷看照片回味呢？😎\n最後感謝你的游玩😘";
        } else {
            msg = (stage === 1) ? 
                "😒慘敗！在貴州的回憶也太薄弱了吧？\n貴州旅行的回憶陷入了危機😱，請重新回憶🙂，\n然後再次挑戰，證明貴州旅行的回憶非常牢固！加油😊" : 
                "🥺 差一點點就通關了！Level 2 的電腦確實很強！\n別灰心，能來到 Level 2 已經很棒了！👍\n再挑戰一次，這次一定能戰勝電腦！加油！🔥";
        }

        let finish_typing_tmr = 5 + msg.length * 2;
        let show_button_tmr = finish_typing_tmr + 40;

        if (tmr < show_button_tmr) return;

        if (stage === 1 && player > computer) stage = 2;
        else if (stage === 1 && player <= computer) stage = 1;
        else if (stage === 2 && player > computer) stage = 1;
        else if (stage === 2 && player <= computer) stage = 2;

        shuffle_card();
        player = 0; computer = 0; proc = 1; tmr = 0;
    }
});

function main() {
    tmr++;
    draw_card();

    let stay_time = (stage === 1) ? 40 : 20;

    if (proc === 0) {
        ctx.fillStyle = "ivory";
        ctx.strokeStyle = "gold";
        ctx.lineWidth = 5;
        ctx.fillRect(300, 270, 600, 100);
        ctx.strokeRect(300, 270, 600, 100);

        ctx.fillStyle = "black";
        ctx.font = "bold 26px 'Microsoft JhengHei'";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Click to change background", 600, 320);

        if (bg_button_clicked) {
            ctx.fillStyle = "ivory";
            ctx.fillRect(250, 420, 300, 100);
            ctx.strokeRect(250, 420, 300, 100);
            ctx.fillStyle = "deepskyblue";
            ctx.font = "bold 40px 'Times New Roman'";
            ctx.fillText("Level 1", 400, 470);

            if (tmr % 20 < 10) {
                ctx.fillStyle = "ivory";
                ctx.fillRect(550, 420, 110, 100);
                ctx.strokeRect(550, 420, 110, 100);
                ctx.fillStyle = "crimson";
                ctx.font = "bold 36px 'Microsoft JhengHei'";
                ctx.fillText("or", 600, 470);
            }

            ctx.fillStyle = "ivory";
            ctx.fillRect(650, 420, 300, 100);
            ctx.strokeRect(650, 420, 300, 100);
            ctx.fillStyle = "crimson";
            ctx.font = "bold 40px 'Times New Roman'";
            ctx.fillText("Level 2", 800, 470);
        }
    }

    // Player 資訊欄
    ctx.fillStyle = (proc >= 1 && proc <= 3) ? "skyblue" : "ivory";
    ctx.strokeStyle = (proc >= 1 && proc <= 3) ? "gold" : "silver";
    ctx.lineWidth = (proc >= 1 && proc <= 3) ? 5 : 3;
    ctx.fillRect(1030, 30, 140, 160);
    ctx.strokeRect(1030, 30, 140, 160);

    ctx.fillStyle = "black";
    ctx.font = "46px 'Times New Roman'";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("player", 1100, 75);
    ctx.fillText(player.toString(), 1100, 145);

    // COM 資訊欄
    ctx.fillStyle = (proc >= 4 && proc <= 6) ? "pink" : "ivory";
    ctx.strokeStyle = (proc >= 4 && proc <= 6) ? "gold" : "silver";
    ctx.lineWidth = (proc >= 4 && proc <= 6) ? 5 : 3;
    ctx.fillRect(1030, 420, 140, 160);
    ctx.strokeRect(1030, 420, 140, 160);

    ctx.fillStyle = "black";
    ctx.fillText("COM", 1100, 465);
    ctx.fillText(computer.toString(), 1100, 535);

    if (proc === 3 && tmr === stay_time) {
        if (card[sel1] === card[sel2]) {
            face[sel1] = 2; face[sel2] = 2;
            player += 2;
            memo[sel1] = -1; memo[sel2] = -1;
            if (player + computer === 26) { proc = 7; tmr = 0; }
            else { proc = 1; tmr = 0; }
        } else {
            face[sel1] = 0; face[sel2] = 0;
            if (stage === 1) memo[sel1] = card[sel1];
            else { memo[sel1] = card[sel1]; memo[sel2] = card[sel2]; }
            proc = 4; tmr = 0;
        }
    }

    if (proc === 4 && tmr === 5) {
        sel1 = com_select1();
        face[sel1] = 1; proc = 5; tmr = 0;
    }

    if (proc === 5 && tmr === 5) {
        sel2 = com_select2(sel1);
        face[sel2] = 1; proc = 6; tmr = 0;
    }

    if (proc === 6 && tmr === stay_time) {
        if (card[sel1] === card[sel2]) {
            face[sel1] = 2; face[sel2] = 2;
            computer += 2;
            memo[sel1] = -1; memo[sel2] = -1;
            if (player + computer === 26) { proc = 7; tmr = 0; }
            else { proc = 4; tmr = 0; }
        } else {
            face[sel1] = 0; face[sel2] = 0;
            if (stage === 1) memo[sel2] = card[sel2];
            else { memo[sel1] = card[sel1]; memo[sel2] = card[sel2]; }
            proc = 1; tmr = 0;
        }
    }

    if (proc === 7) {
        let target_x = 600;
        let start_x = 1300;
        let slide_progress = Math.min(1.0, tmr / 10.0);
        let current_x = start_x - (start_x - target_x) * slide_progress;

        let full_msg = "";
        let box_fill = "navy", text_color = "cyan";

        if (player > computer) {
            full_msg = (stage === 1) ? 
                "✨ 太棒了！先下一城！😎\n不過第一關只是熱身，電腦在第二關會火力全開的！🔥\n敢不敢繼續挑戰 Level 2，證明貴州旅行的回憶很牢固？😈" : 
                "🎉恭喜你，打敗了電腦！\n看來貴州旅行的回憶還很牢固！🤩是不是經常偷偷看照片回味呢？😎\n最後感謝你的游玩😘";
            box_fill = "navy"; text_color = "cyan";
        } else {
            full_msg = (stage === 1) ? 
                "😒慘敗！在貴州的回憶也太薄弱了吧？\n貴州旅行的回憶陷入了危機😱，請重新回憶🙂，\n然後再次挑戰，證明貴州旅行的回憶非常牢固！加油😊" : 
                "🥺 差一點點就通關了！Level 2 的電腦確實很強！\n別灰心，能來到 Level 2 已經很棒了！👍\n再挑戰一次，這次一定能戰勝電腦！加油！🔥";
            box_fill = "maroon"; text_color = "gold";
        }

        let char_count = Math.max(1, Math.floor((tmr - 5) / 2));
        let current_msg = full_msg.substring(0, char_count);

        let finish_typing_tmr = 5 + full_msg.length * 2;
        let show_button_tmr = finish_typing_tmr + 40;

        if (tmr <= show_button_tmr) {
            ctx.fillStyle = box_fill;
            ctx.strokeStyle = (box_fill === "navy") ? "gold" : "red";
            ctx.lineWidth = 4;
            ctx.fillRect(current_x - 550, 270, 1100, 240);
            ctx.strokeRect(current_x - 550, 270, 1100, 240);

            ctx.fillStyle = text_color;
            ctx.font = "bold 32px 'Microsoft JhengHei'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            let lines = current_msg.split('\n');
            let startY = 390 - ((lines.length - 1) * 20);
            lines.forEach((line, index) => {
                ctx.fillText(line, current_x, startY + (index * 40));
            });
        }

        if (tmr >= show_button_tmr && (tmr % 20 < 12)) {
            ctx.fillStyle = "ivory";
            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;
            ctx.fillRect(820, 630, 360, 80);
            ctx.strokeRect(820, 630, 360, 80);

            let next_text = "";
            if (stage === 1) {
                next_text = (player > computer) ? "Click to Level 2" : "Click to Restart";
            } else {
                next_text = (player > computer) ? "Click to Restart" : "Retry Level 2";
            }

            ctx.fillStyle = "black";
            ctx.font = "bold 30px 'Times New Roman'";
            ctx.fillText(next_text, 1000, 670);
        }
    }

    setTimeout(main, 50);
}

main();
</script>

</body>
</html>
